# Netlify configuration for ScrollWise (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Redirect all routes to index.html so React Router handles them client-side.
# Without this, refreshing /feed, /dashboard etc. returns a Netlify 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively (Vite hashes filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
